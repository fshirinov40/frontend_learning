<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form style="display: flex; flex-direction: column; max-width: 400px;">
    <label for="password">Enter a password:</label>
    <input type="password" id="password" name="password">
    <br>
    <br>
  </form>
  <button id="submit">submit</button>
  <div id="info"></div>

  <script>
    const button = document.getElementById("submit");
    const info = document.getElementById("info");

    button.onclick = function() {
      let strength, uppercase;

      const password = document.getElementById("password").value;

      if (password === "") {
        info.innerHTML = `<p>Please enter a password</p>`;
        return;
      }

      if(password.length < 6) strength = 'Weak';
      else if(password.length >= 6 && password.length <= 9) strength = 'Medium';
      else if(password.length > 9) strength = 'Strong';

      if (password[0] === password[0].toUpperCase()) uppercase = 'Yes';
      else uppercase = 'No';

      info.innerHTML = `
        <p>Length: ${password.length}</p>
        <p>Strength: ${strength}</p>
        <p>Starts with uppercase: ${uppercase}</p>
      `
    }
  </script>
</body>
</html>
