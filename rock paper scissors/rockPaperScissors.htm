<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="css/rockPaperScissors.css">
</head>
<body>
  <p class="title">Rock Paper Scissors</p>

  <button onclick="
    playGame('Rock')
  " class="css-button"><img src="images/rock-emoji.png" alt="Rock" class="emoji"></button>

  <button onclick="
    playGame('Paper')
  " class="css-button"><img src="images/paper-emoji.png" alt="Paper" class="emoji"></button>

  <button onclick="
    playGame('Scissors')
  " class="css-button"><img src="images/scissors-emoji.png" alt="Scissors" class="emoji"></button>

  <p class="js-result css-result"></p>
  <p class="js-moves"></p>
  <p class="js-score css-score"></p>
  
  <button onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('score');
    updateScore();
  " class="reset-score-button"
  >Reset Score</button>

  <script src="js/rockPaperScissors.js"></script>
</body>
</html>
