<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <label for="password">Enter password:</label>
  <input type="password" name="password" id="password">
  <br>
  <button id="submit">Submit</button>

  <div id="info"></div>

  <script>
    const button = document.getElementById('submit');
    const info = document.getElementById('info');

    button.onclick = function function1() {
      info.innerHTML = '';
      const password = document.getElementById('password').value;
      let condition1=false,
          condition2=false,
          condition3=false,
          condition4=false;
      if(password.length >=8) {
        condition1 = true;
      }
      else {
        condition1 = false;
      }

      for(let i=0; i<password.length; i++) {
        if(password[i] >= '0' && password[i] <= '9') {
          condition2 = true;
        }

        if (password[i] !== password[i].toLowerCase() && password[i] === password[i].toUpperCase()) {
          condition3 = true;
        }

        if(password[i] === '!' || password[i] === '@' || password[i] === '#' || password[i] === '$') {
          condition4 = true;
        }
      }

      let count = 0, strength;
      if(condition1) count++;
      if(condition2) count++;
      if(condition3) count++;
      if(condition4) count++;

      function findFalseCondition() {
        if(condition1 === false) {
          info.innerHTML += `<p>Condition1 is false</p>`;
        }
        if(condition2 === false) {
          info.innerHTML += `<p>Condition2 is false</p>`;
        }
        if(condition3 === false) {
          info.innerHTML += `<p>Condition3 is false</p>`;
        }
        if(condition4 === false) {
          info.innerHTML += `<p>Condition4 is false</p>`;
        }
      }

      if(count === 0 || count === 1) {
        strength = 'Weak';
        info.innerHTML = `Strength: ${strength}`;
        findFalseCondition();
      }
      else if(count === 2 || count === 3) {
        strength = 'Medium';
        info.innerHTML = `Strength: ${strength}`;
        findFalseCondition();
      }
      else if(count === 4) {
        strength = 'Strong';
        info.innerHTML = `Strength: ${strength}`;
      }
    }
  </script>
</body>
</html>
